name: Refresh card data & prices

on:
  schedule:
    - cron: '17 4 * * 1' # every Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-data.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh artwork cameos
        run: |
          pip install openpyxl
          python3 scripts/build_cameos.py || echo "Cameo sheet unavailable - keeping the previous data/cameos.json"
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh card data and prices"
          git push
